# Global configuration for the e2e-testing-service.
# Credentials and infrastructure values should always come from
# environment variables via {{env.VAR_NAME}}. Never hardcode secrets.

version: "1"

server:
  port: 8080
  timeout: 30s

auth:
  enabled: true
  jwt_secret: "{{env.JWT_SECRET}}"

store:
  type: redis        # redis | postgres | memory | none   (default: redis)
  redis:
    url: "{{env.REDIS_URL}}"
    ttl: 300s
    username: "{{env.REDIS_USERNAME}}"
    password: "{{env.REDIS_PASSWORD}}"
    cluster_mode: false
  postgres:
    dsn: "{{env.POSTGRES_DSN}}"
    ttl: 300s
  memory:
    ttl: 300s

scheduler:
  enabled: true
  timezone: "Europe/Madrid"

tests:
  path: "tests"

test_groups:
  ci:
    description: "Pipeline that runs after every merge"
    tests:
      - local_loop_test
      - example_variables
      - example_increment_int_assertions
    test_delay: 2s
    skip_fail_test: true
  smoke:
    tests:
      - local_loop_test

receivers:
  sms:
    provider: twilio
    # fields TBD during SmsReceiver implementation
  push:
    provider: fcm
    # fields TBD during PushReceiver implementation
  webhook:
    base_url: "{{env.WEBHOOK_BASE_URL}}"

logging:
  level: info       # debug | info | warn | error
  format: json      # json (production) | text (local)
