<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e2e-framework Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      e2e-framework
    </div>
    <div class="header-health">
      <div class="dot" id="health-dot"></div>
      <span id="health-label">Checking...</span>
    </div>
    <div id="token-area"></div>
    <div class="header-actions">
      <button class="btn btn-sm" id="btn-refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Tests</div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search tests...">
        </div>
      </div>
      <div class="sidebar-actions">
        <button class="btn btn-primary btn-sm" id="btn-run-all">
          <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12">
            <path d="M8 5v14l11-7z"/>
          </svg>
          Run Sequence
        </button>
      </div>
      <div class="test-list" id="test-list">
        <!-- Test items rendered here -->
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main" id="main-content">
      <div class="main-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <p>Select a test from the sidebar</p>
      </div>
    </div>

  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/app.js"></script>
</body>
</html>
