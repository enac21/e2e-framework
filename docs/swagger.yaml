basePath: /
definitions:
  domain.Message:
    properties:
      fields:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        type: object
      raw:
        items:
          format: int32
          type: integer
        type: array
      receivedAt:
        type: string
      receiverType:
        type: string
      runID:
        type: string
    type: object
  domain.ReceiverResult:
    properties:
      duration_ms:
        type: integer
      error:
        type: string
      message:
        $ref: '#/definitions/domain.Message'
      status:
        $ref: '#/definitions/domain.RunStatus'
      trigger_index:
        type: integer
      type:
        type: string
    type: object
  domain.RunStatus:
    enum:
    - passed
    - failed
    - error
    - skipped
    - running
    type: string
    x-enum-varnames:
    - StatusPassed
    - StatusFailed
    - StatusError
    - StatusSkipped
    - StatusRunning
  domain.TestResult:
    properties:
      attempts:
        type: integer
      duration_ms:
        type: integer
      error:
        type: string
      finished_at:
        type: string
      receivers:
        items:
          $ref: '#/definitions/domain.ReceiverResult'
        type: array
      run_id:
        type: string
      started_at:
        type: string
      status:
        $ref: '#/definitions/domain.RunStatus'
      test_id:
        type: string
      trigger_vars:
        additionalProperties:
          type: string
        type: object
    type: object
info:
  contact: {}
  description: This is the API for the e2e-framework testing service.
  title: e2e-framework API
  version: "1.0"
paths:
  /health:
    get:
      description: Get the current status of the service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check service health
      tags:
      - Health
  /results:
    get:
      description: Get the last 100 test results
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.TestResult'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: List test results
      tags:
      - Results
  /results/{run_id}:
    get:
      description: Get a test result by its unique Run ID
      parameters:
      - description: Run ID
        in: path
        name: run_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.TestResult'
        "400":
          description: Run ID required
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Run not found
          schema:
            type: string
      summary: Get a specific test result
      tags:
      - Results
  /run:
    post:
      description: Trigger a specific test by ID. Can be sync or async depends of
        the test definition.
      parameters:
      - description: Test ID defined in tests definitions
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.TestResult'
        "202":
          description: 'Async mode: returns run_id and status'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Test ID not found
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
      summary: Run a test
      tags:
      - Tests
  /run-sequence:
    post:
      consumes:
      - application/json
      description: Execute an ordered list of test IDs sequentially, or run a configured
        test group. The body is a plain JSON array of test IDs; alternatively pass
        test_group as a query param to expand a configured group.
      parameters:
      - description: Name of a configured test group to run instead of an explicit
          list
        in: query
        name: test_group
        type: string
      - description: Ordered list of test IDs (not used when test_group is set)
        in: body
        name: body
        schema:
          items:
            type: string
          type: array
      - description: Duration to wait between tests (e.g. '2s'). Not applied before
          the first test.
        in: query
        name: test_delay
        type: string
      - description: Stop the sequence after the first failed or errored test (default
          false)
        in: query
        name: skip_fail_test
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.TestResult'
            type: array
        "400":
          description: Invalid body or parameters
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Test ID or test group not found
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
      summary: Run a sequence of tests
      tags:
      - Tests
  /webhook/{provider}:
    post:
      description: Deposit messages from providers into the store
      parameters:
      - description: Provider name (e.g., twilio, meta)
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: Error extracting message data
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Unknown provider
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Receive webhook from provider
      tags:
      - Webhooks
swagger: "2.0"
